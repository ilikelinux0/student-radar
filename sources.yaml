# Sources, verified 2026-10-12. See docs/SOURCES.md.
# The first tag is the group the reader shows the source under.
# Job boards are daily and close postings that disappear. Program pages that
# say "Başvurular henüz başlamadı" are weekly; the page diff fires when they
# open. usually_opens is what the program did in earlier years.

# --- Job boards (Turkish companies with public board APIs) ---

- id: picus-jobs
  name: Picus Security jobs
  url: https://api.lever.co/v0/postings/picus?mode=json
  type: api
  frequency: daily
  fields: {title: text, url: hostedUrl, summary: descriptionPlain, location: categories.location}
  require_title: [level]
  closes_missing: true
  tags: [jobs, security]

# SmartRecruiters' robots.txt disallows its API, so these two read the public
# career page instead. Each posting card is one line of the page diff.
- id: lostar-jobs
  name: Lostar jobs
  url: https://careers.smartrecruiters.com/Lostar
  type: scrape
  frequency: daily
  selector: li.opening-job
  require_title: [level]
  tags: [jobs, security]

- id: brandefense-jobs
  name: Brandefense jobs
  url: https://careers.smartrecruiters.com/brandefense
  type: scrape
  frequency: daily
  selector: li.opening-job
  require_title: [level]
  tags: [jobs, security]

- id: trendyol-jobs
  name: Trendyol jobs
  url: https://api.lever.co/v0/postings/trendyol?mode=json
  type: api
  frequency: daily
  fields: {title: text, url: hostedUrl, summary: descriptionPlain, location: categories.location}
  require_title: [level, tech]
  closes_missing: true
  tags: [jobs, tech]

- id: dreamgames-jobs
  name: Dream Games jobs
  url: https://api.lever.co/v0/postings/dreamgames?mode=json
